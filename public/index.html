  <!--
    Fonts. `media="print"` + an inline onload swap is the usual
    non-blocking trick, but inline event handlers are blocked by our strict
    CSP (script-src 'self'), so the stylesheet is linked normally. `display=swap`
    already prevents invisible text, and the local system-font stack in
    main.css renders immediately as the fallback.
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Rajdhani:wght@600;700&family=JetBrains+Mono:wght@400;700&display=swap">

  <link rel="stylesheet" href="/styles/main.css">
  <link rel="stylesheet" href="/styles/battle.css">

  <!--
    Structured data. VideoGame is the correct type for a playable browser game
    and is what enables rich results for genre, price and platform. The
    explicit £0.00 Offer is the machine-readable statement of the
    free-forever promise.
  -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "VideoGame",
        "@id": "https://dlinacre.github.io/dragon-rush-heroes/#game",
        "name": "Dragon Rush Heroes",
        "url": "https://dlinacre.github.io/dragon-rush-heroes/",
        "description": "An original anime action-RPG card battler with 464 collectible fighters, real-time Arts-card combat, an elemental advantage wheel and provably-fair summoning. Free forever with no purchases, no advertising and no energy gates.",
        "image": "https://dlinacre.github.io/dragon-rush-heroes/og-image.png",
        "inLanguage": "en-GB",
        "genre": ["Role-playing game", "Card battle game", "Action game"],
        "gamePlatform": ["Web browser", "PC", "Mobile"],
        "applicationCategory": "Game",
        "operatingSystem": "Any (modern web browser)",
        "playMode": "SinglePlayer",
        "isAccessibleForFree": true,
        "offers": {
          "@type": "Offer",
          "price": "0.00",
          "priceCurrency": "GBP",
          "availability": "https://schema.org/InStock"
        },
        "author": { "@type": "Person", "name": "DLinacre" },
        "publisher": { "@id": "https://dlinacre.github.io/dragon-rush-heroes/#publisher" }
      },
      {
        "@type": "WebSite",
        "@id": "https://dlinacre.github.io/dragon-rush-heroes/#website",
        "url": "https://dlinacre.github.io/dragon-rush-heroes/",
        "name": "Dragon Rush Heroes",
        "inLanguage": "en-GB",
        "publisher": { "@id": "https://dlinacre.github.io/dragon-rush-heroes/#publisher" }
      },
      {
        "@type": "Organization",
        "@id": "https://dlinacre.github.io/dragon-rush-heroes/#publisher",
        "name": "Dragon Rush Heroes",
        "url": "https://dlinacre.github.io/dragon-rush-heroes/",
        "logo": "https://dlinacre.github.io/dragon-rush-heroes/icon.svg"
      }
    ]
  }
  </script>
</head>
<body>
  <!--
    The entire UI is constructed by JavaScript modules under /app.
    This shell holds only the mount point and a no-JS fallback.
  -->
  <div id="app"></div>

  <noscript>
    <div style="max-width:560px;margin:15vh auto;padding:32px;text-align:center;
                font-family:system-ui,sans-serif;color:#f2f5ff">
      <h1 style="font-size:28px;margin-bottom:12px">JavaScript required</h1>
      <p style="color:#b6bede;line-height:1.6">
        Dragon Rush Heroes is a real-time battle game rendered on canvas, so it needs
        JavaScript enabled. Please turn it on and reload.
      </p>
    </div>
  </noscript>

  <script type="module" src="/app/main.js"></script>
</body>
</html>
