<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
  <meta name="theme-color" content="#05060d">
  <meta name="color-scheme" content="dark">

  <title>Dragon Rush Heroes — Free Anime Action RPG</title>
  <meta name="description" content="An original anime action-RPG card battler. 464 fighters, real-time Arts combat, provably-fair summons. 100% free forever — no purchases, no ads, no energy gates.">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Dragon Rush Heroes — Free Anime Action RPG">
  <meta property="og:description" content="464 fighters. Real-time Arts combat. Provably-fair summons. Free forever.">

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%23ffb020'/><circle cx='11' cy='11' r='4' fill='%23fff6d0' opacity='.7'/><text x='16' y='22' font-size='15' text-anchor='middle' fill='%23a8320a'>★</text></svg>">

  <!--
    Fonts. `media="print"` + an inline onload swap is the usual
    non-blocking trick, but inline event handlers are blocked by our strict
    CSP (script-src 'self'), so the stylesheet is linked normally. `display=swap`
    already prevents invisible text, and the local system-font stack in
    main.css renders immediately as the fallback.
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Rajdhani:wght@600;700&family=JetBrains+Mono:wght@400;700&display=swap">

  <link rel="stylesheet" href="/styles/main.css">
  <link rel="stylesheet" href="/styles/battle.css">
</head>
<body>
  <!--
    The entire UI is constructed by JavaScript modules under /app.
    This shell holds only the mount point and a no-JS fallback.
  -->
  <div id="app"></div>

  <noscript>
    <div style="max-width:560px;margin:15vh auto;padding:32px;text-align:center;
                font-family:system-ui,sans-serif;color:#f2f5ff">
      <h1 style="font-size:28px;margin-bottom:12px">JavaScript required</h1>
      <p style="color:#b6bede;line-height:1.6">
        Dragon Rush Heroes is a real-time battle game rendered on canvas, so it needs
        JavaScript enabled. Please turn it on and reload.
      </p>
    </div>
  </noscript>

  <script type="module" src="/app/main.js"></script>
</body>
</html>
