name: Bug report
description: Something is broken or behaving unexpectedly
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Click '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Where did this happen?
      options:
        - Hosted demo (GitHub Pages)
        - Local self-hosted server
        - Both
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Browser / Node version
      placeholder: "Chrome 131 / Node 20.11"
  - type: textarea
    id: console
    attributes:
      label: Console output
      render: shell
