name: Feature request
description: Suggest an idea for the game
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Combat / game systems
        - Roster / progression
        - Summoning / economy
        - UI / UX
        - Accessibility
        - Performance
        - Developer experience
    validations:
      required: true
